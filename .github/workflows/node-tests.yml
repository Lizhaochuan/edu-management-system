name: Node regression tests

on:
  pull_request:
    branches: [work, main]
  push:
    branches: [work, main, 'chatgpt/**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Node syntax
        run: |
          node --check server.js
          node --check services/salaryEngineService.js
      - name: Run isolated regression suite
        run: npm test
