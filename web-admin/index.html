<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>培训机构教务与财务管理系统 · 监控与调试控制台</title>
  <link rel="stylesheet" href="/css/style.css">
  <!-- 优先加载 Vue 3 CDN，无网络自动平滑回退至本地 vendor 垫片 -->
  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
  <script>
    if (!window.Vue) {
      document.write('<script src="/vendor/vue.global.prod.js"><\/script>');
    }
  </script>
</head>
<body>
  <div id="app">
    <!-- 顶部导航栏 -->
    <header class="top-navbar">
      <div class="brand-section">
        <span class="brand-icon">🏫</span>
        <span class="brand-title">教务与财务管理系统 · PC Web 监控与调试控制台</span>
        <span class="brand-tag">Phase 6-A 同库实时架构</span>
      </div>

      <div class="nav-right-section">
        <!-- 实时 SSE 连接指示器 -->
        <div class="live-indicator">
          <span class="live-dot" :style="{ background: sseStatus === 'connected' ? '#52c41a' : '#faad14' }"></span>
          <span>{{ sseStatus === 'connected' ? 'SSE 实时长连接已就绪' : '连接同步中...' }}</span>
          <span style="color: #64748b; font-size: 11px;">(最后同步: {{ lastSyncTime }})</span>
          <span v-if="liveEventCount > 0" class="badge badge-green" style="font-size: 10px;">{{ liveEventCount }} 次事件</span>
        </div>

        <!-- 服务端认证后的身份只读展示；禁止模拟切换到其他权限 -->
        <div class="role-switcher-box">
          <span class="rs-label">当前登录：</span>
          <span>{{ currentIdentity.name }}</span>
          <span class="badge" :class="currentIdentity.badgeClass">{{ currentIdentity.roleText }}</span>
          <button class="btn-action-sm" @click="onLogout">退出登录</button>
        </div>
      </div>
    </header>

    <!-- 主导航 Tabs -->
    <nav class="main-tabs-bar">
      <button 
        class="tab-btn" 
        :class="{ active: currentTab === 'logs' }" 
        @click="onTabChange('logs')"
      >
        <span>📋</span>
        <span>1. 全局操作审计日志台 (实时滚动)</span>
      </button>

      <button 
        class="tab-btn" 
        :class="{ active: currentTab === 'inspector' }" 
        @click="onTabChange('inspector')"
      >
        <span>🔍</span>
        <span>2. 全量数据与快照透视镜</span>
      </button>

      <button 
        class="tab-btn" 
        :class="{ active: currentTab === 'monitor' }" 
        @click="onTabChange('monitor')"
      >
        <span>🚨</span>
        <span>3. 异常与预警监控大盘</span>
        <span 
          v-if="(anomalyMetrics.locked_packages_count + anomalyMetrics.invalidated_approvals_count + anomalyMetrics.debt_packages_count + anomalyMetrics.low_balance_packages_count) > 0" 
          class="tab-badge badge-danger"
        >
          {{ anomalyMetrics.locked_packages_count + anomalyMetrics.invalidated_approvals_count + anomalyMetrics.debt_packages_count + anomalyMetrics.low_balance_packages_count }}
        </span>
      </button>

      <button 
        class="tab-btn" 
        :class="{ active: currentTab === 'toolbox' }" 
        @click="onTabChange('toolbox')"
      >
        <span>🛠️</span>
        <span>4. 开发调试沙盒工具</span>
      </button>
    </nav>

    <!-- 实时浮动消息提示 Toast -->
    <div 
      v-if="recentToastMsg" 
      style="position: fixed; bottom: 24px; right: 24px; background: #0f172a; color: #ffffff; padding: 12px 20px; border-radius: 8px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); z-index: 9999; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; border-left: 4px solid #1890ff;"
    >
      <span>🔔</span>
      <span>{{ recentToastMsg }}</span>
    </div>

    <!-- 主内容区 -->
    <main class="app-content">
      <!-- 页面 1：全局操作审计日志台 -->
      <audit-logs-view ref="logsRef" v-show="currentTab === 'logs'"></audit-logs-view>

      <!-- 页面 2：全量数据与快照透视镜 -->
      <inspector-view ref="inspectorRef" v-show="currentTab === 'inspector'"></inspector-view>

      <!-- 页面 3：异常与预警监控大盘 -->
      <monitor-view ref="monitorRef" v-show="currentTab === 'monitor'"></monitor-view>

      <!-- 页面 4：开发调试沙盒工具 -->
      <toolbox-view ref="toolboxRef" v-show="currentTab === 'toolbox'"></toolbox-view>
    </main>
  </div>

  <!-- 引入业务脚本 -->
  <script src="/js/api.js"></script>
  <script src="/js/components/audit-logs.js"></script>
  <script src="/js/components/inspector.js"></script>
  <script src="/js/components/monitor.js"></script>
  <script src="/js/components/toolbox.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
